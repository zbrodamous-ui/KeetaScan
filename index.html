<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeetaScan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="main-nav">

    <a href="index.html" class="active">Home</a>

    <a href="blocks.html">Blocks</a>

    <a href="transactions.html">Transactions</a>

    <a href="addresses.html">Addresses</a>

    <a href="assets.html">Assets</a>

    <a href="status.html">Status</a>


    <button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    aria-label="Switch to light mode"
>
    Light Mode
</button>

</nav>
    <main class="hero">

        <div class="network-visual">
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>

            <div class="brand">

    <img
       
    >

    <h1>KeetaScan</h1>

    <p>Explore the Keeta Network</p>

</div>
            
            <div class="search-area">

    <select id="searchType">
        <option value="transaction">Transaction</option>
        <option value="address">Address</option>
        <option value="block">Block</option>
        <option value="asset">Asset</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Search the Keeta Network">

    <button id="searchButton">
        Search
    </button>
 
</div>

</main>

<section class="home-dashboard">

    <div class="stat-card">
        <span class="stat-label">Total Transactions</span>
        <strong class="stat-value" id="totalTransactions">—</strong>
    </div>

    <div class="stat-card">
        <span class="stat-label">Latest Block</span>
        <strong class="stat-value" id="latestBlock">—</strong>
    </div>

    <div class="stat-card">
    <span class="stat-label">Recent TPS</span>
    <strong class="stat-value" id="networkTPS">—</strong>
</div>

<div class="stat-card">
    <span class="stat-label">Known Assets</span>
    <strong class="stat-value" id="totalAssets">—</strong>
</div>
<section class="network-overview">


</section>
<section class="latest-activity-panel">

    <div class="panel-header">
        <h2>Latest Activity</h2>
        <a href="transactions.html">View All</a>
    </div>

    <div class="activity-table">

        <div class="activity-table-header">
            <span>Block</span>
            <span>Age</span>
            <span>Type</span>
            <span>From</span>
            <span>To</span>
            <span>Amount</span>
        </div>

        <div id="latestActivityList">
            Loading activity...
        </div>

    </div>

</section>

<script src="https://static.test.keeta.com/keetanet-browser.js"></script>
<script src="shared.js"></script>
<script src="script.js"></script>
</body>
</html>
