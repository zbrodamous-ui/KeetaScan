    <nav class="main-nav">
        <a href="index.html">Home</a>

            id="themeToggle"

            type="button"

    <main class="asset-detail-page">

        <section class="asset-detail-header">
            <h1 id="assetTitle">
                Loading Asset...
            </h1>

            <p id="assetDescription"></p>
        </section>

        <section class="analytics-panel">

            <div class="asset-detail-row">
                <span>Address</span>
                <strong id="assetAddress">—</strong>
            </div>

            <div class="asset-detail-row">
    <span>Network Asset Supply</span>
    <strong id="assetSupply">—</strong>
           </div>

            <div class="asset-detail-row">
                <span>Decimals</span>
                <strong id="assetDecimals">—</strong>
            </div>

        </section>
<section class="asset-transfers">
    <h2>Recent Transfers</h2>

    <div class="asset-transfer-header">
        <span>From</span>
        <span>To</span>
        <span>Amount</span>
        <span>Age</span>
    </div>

    <div id="assetTransfersList">
        <p>Loading recent transfers...</p>
    </div>
</section>
    </main>
